<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Hi, I'm Randy — call me RK. Full-Stack Dev, AI and Automation Builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#3b1d8f"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <clipPath id="round"><rect width="900" height="220" rx="14"/></clipPath>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <style>
    .t { font: 700 40px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #fff; }
    .s { font: 500 18px 'Fira Code', Consolas, 'Courier New', monospace; fill: #fcd34d; }
    .fade { opacity: 0; animation: in 1.2s ease-out forwards; }
    .d2 { animation-delay: .4s; }
    .w1 { animation: drift 9s ease-in-out infinite alternate; }
    .w2 { animation: drift 13s ease-in-out infinite alternate-reverse; }
    .node { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-60px); } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  </style>
  <rect width="900" height="220" rx="14" fill="url(#bg)"/>
  <rect width="900" height="220" rx="14" fill="url(#grid)"/>

  <!-- agent "network" -->
  <g stroke="#a78bfa" stroke-opacity=".35" stroke-width="1.4" fill="none">
    <path d="M760 40 L820 78 L790 130 L850 150"/>
    <path d="M820 78 L870 60"/>
    <path d="M60 40 L110 70 L80 110"/>
  </g>
  <g fill="#fcd34d">
    <circle class="node" cx="760" cy="40" r="4"/>
    <circle class="node" cx="820" cy="78" r="5" style="animation-delay:.6s"/>
    <circle class="node" cx="790" cy="130" r="4" style="animation-delay:1.2s"/>
    <circle class="node" cx="850" cy="150" r="3.5" style="animation-delay:.3s"/>
    <circle class="node" cx="870" cy="60" r="3" style="animation-delay:1.6s"/>
    <circle class="node" cx="60" cy="40" r="3.5" style="animation-delay:.9s"/>
    <circle class="node" cx="110" cy="70" r="4.5" style="animation-delay:.2s"/>
    <circle class="node" cx="80" cy="110" r="3" style="animation-delay:1.4s"/>
  </g>

  <text class="t fade" x="450" y="98" text-anchor="middle">Hi, I'm Randy — call me RK 🕶️</text>
  <text class="s fade d2" x="450" y="134" text-anchor="middle">Full-Stack Dev • AI &amp; Automation Builder</text>

  <!-- waves -->
  <g clip-path="url(#round)">
    <path class="w1" fill="url(#wave)" fill-opacity=".35" d="M0 185 C 120 160, 240 210, 360 186 S 600 160, 720 186 S 900 210, 1000 182 L1000 220 L0 220 Z"/>
    <path class="w2" fill="url(#wave)" fill-opacity=".6" d="M0 200 C 150 182, 300 218, 450 198 S 750 180, 1000 200 L1000 220 L0 220 Z"/>
  </g>
</svg>
