name: Profile cards

# Generates the stats, top-languages and snake SVGs with the repo's own
# GITHUB_TOKEN and publishes them to the unprotected `output` branch, so main's
# pull-request rule stays in force and the README never depends on a third-party server.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=randy-kip&show_icons=true&include_all_commits=true&count_private=true&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=F59E0B&icon_color=A78BFA&rank_icon=github
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=randy-kip&layout=compact&langs_count=8&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=F59E0B&hide=jupyter%20notebook
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: randy-kip
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#F59E0B&color_dots=#161b22,#3b2a6b,#5b3fa8,#7c5ce0,#a78bfa

      - name: Publish cards to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update profile cards"
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
